<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082f49">
  <title>競艇 選手年次データ</title>
  <style>
    :root{--navy:#082f49;--blue:#0369a1;--sky:#e0f2fe;--line:#cbd5e1;--bg:#f8fafc;--text:#0f172a;--muted:#64748b;--red:#be123c;--gold:#b45309;--green:#047857}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.55}
    button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#082f49,#0369a1);color:#fff;padding:24px 0;box-shadow:0 2px 10px #0002}.hero h1{font-size:clamp(22px,5vw,34px);margin:0}.hero p{margin:4px 0 0;opacity:.8}
    .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px;box-shadow:0 3px 12px #0f172a0d}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.years{display:flex;gap:8px}.year,.tab,.action{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:700}.year.active,.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .search{position:relative;flex:1;min-width:220px}.search input{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}.search input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #0ea5e922}.suggestions{position:absolute;z-index:10;top:calc(100% + 5px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #0002;max-height:330px;overflow:auto}.suggestions button{display:block;width:100%;border:0;border-bottom:1px solid #e2e8f0;background:#fff;padding:12px 14px;text-align:left}.suggestions button:hover{background:var(--sky)}.hidden{display:none!important}
    .status{color:var(--muted);font-size:14px;margin-top:10px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin:16px 0}.tab{white-space:nowrap}.title-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.racer-name{font-size:28px;margin:0}.reg{color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.action.favorite.on{background:#fff7ed;border-color:#f59e0b;color:var(--gold)}.action.blocked.on{background:#fff1f2;border-color:#fb7185;color:var(--red)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f1f5f9;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:21px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:10px 8px;border-bottom:1px solid #e2e8f0;text-align:right;white-space:nowrap}th{background:#f1f5f9;color:#475569;font-size:13px;position:sticky;top:0}th:first-child,td:first-child{text-align:left}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.method{border-radius:12px;background:#f1f5f9;padding:14px}.method strong{font-size:22px;color:var(--blue)}
    textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}.save-note{margin-top:8px;background:var(--blue);border:0;color:#fff;border-radius:10px;padding:9px 18px}.list-card{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #e2e8f0;padding:12px 2px}.list-card button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px}.empty{text-align:center;color:var(--muted);padding:36px 12px}.foot{font-size:12px;color:var(--muted);padding:20px 0 36px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:10px;padding:10px 16px;z-index:30;box-shadow:0 8px 22px #0004}
    @media(max-width:650px){.wrap{padding:12px}.panel{border-radius:12px;padding:13px}.stats{grid-template-columns:repeat(2,1fr)}.method-grid{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:stretch}.search{order:2;flex-basis:100%}.racer-name{font-size:23px}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><h1>競艇 選手年次データ</h1><p>選手ごとの成績を、年・コース・場・決まり手別に確認</p></div></header>
  <main class="wrap">
    <section class="panel">
      <div class="toolbar">
        <div class="years" aria-label="年選択"><button class="year" data-year="2025">2025</button><button class="year" data-year="2026">2026</button></div>
        <div class="search"><input id="query" type="search" autocomplete="off" placeholder="選手名・登録番号で検索" aria-label="選手検索"><div id="suggestions" class="suggestions hidden"></div></div>
      </div>
      <div id="status" class="status">データを確認しています…</div>
      <div class="tabs" role="tablist"><button class="tab active" data-view="search">選手検索</button><button class="tab" data-view="favorites">★ お気に入り <span id="favCount"></span></button><button class="tab" data-view="blocked">× もう買わない <span id="blockCount"></span></button></div>
    </section>
    <section id="content" class="panel"><div class="empty">上の検索欄に選手名を入力してください。</div></section>
    <footer class="foot">「1着率」は1着回数÷出走数です。データ元：BOAT RACE公式 競走成績ダウンロード。お気に入り・もう買わない・備考は、この端末のブラウザ内だけに保存されます。</footer>
  </main>
  <div id="toast" class="toast hidden"></div>
<script>
(() => {
  'use strict';
  const YEARS=[2025,2026], STORAGE_KEY='boat-racer-notes-v1';
  const state={year:2026,index:null,selected:null,view:'search',indexes:new Map(),parts:new Map(),prefs:loadPrefs()};
  const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function loadPrefs(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return {}}}
  function savePrefs(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.prefs)); updateCounts()}
  function key(r,year=state.year){return `${year}:${r.registration||r.no||r.name}`}
  function pref(r,year=state.year){const k=key(r,year);return state.prefs[k]||(state.prefs[k]={year,name:r.name,registration:r.registration||r.no||'',favorite:false,blocked:false,note:''})}
  function setStatus(msg,error=false){$('#status').textContent=msg;$('#status').style.color=error?'var(--red)':''}
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),1800)}
  async function json(url){const res=await fetch(url,{cache:'no-cache'});if(!res.ok)throw new Error(`${res.status} ${url}`);return res.json()}
  async function loadIndex(year){
    if(state.indexes.has(year))return state.indexes.get(year);
    setStatus(`${year}年の選手一覧を読み込んでいます…`);
    const data=await json(`data/${year}/index.json`);
    if(!Array.isArray(data.racers))throw new Error('index.json の racers が見つかりません');
    state.indexes.set(year,data);return data;
  }
  async function changeYear(year){
    state.year=Number(year);state.selected=null;$('#query').value='';$('#suggestions').classList.add('hidden');
    document.querySelectorAll('.year').forEach(b=>b.classList.toggle('active',Number(b.dataset.year)===state.year));
    try{state.index=await loadIndex(state.year);setStatus(`${state.year}年：${state.index.count??state.index.racers.length}選手（名前を入力すると候補が出ます）`);renderCurrentView()}
    catch(e){state.index=null;setStatus(`${state.year}年の data/${state.year}/index.json を読み込めませんでした。`,true);$('#content').innerHTML='<div class="empty">分割JSONの配置を確認してください。</div>';console.error(e)}
  }
  function normalize(s){return String(s??'').normalize('NFKC').replace(/[\s　]/g,'').toLowerCase()}
  function showSuggestions(){
    if(!state.index)return;const q=normalize($('#query').value),box=$('#suggestions');
    if(!q){box.classList.add('hidden');return}
    const found=state.index.racers.filter(r=>normalize(r.name).includes(q)||normalize(r.no).includes(q)).slice(0,40);
    box.innerHTML=found.length?found.map((r,i)=>`<button data-i="${i}"><strong>${esc(r.name)}</strong>${r.no?` <small>登録 ${esc(r.no)}</small>`:''}</button>`).join(''):'<div class="empty">該当する選手がいません</div>';
    box.classList.remove('hidden');box.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>selectFromIndex(found[i]));
  }
  async function selectFromIndex(item){
    $('#suggestions').classList.add('hidden');$('#query').value=item.name;setStatus(`${item.name} のデータを読み込んでいます…`);
    try{const cacheKey=`${state.year}/${item.part}`;let part=state.parts.get(cacheKey);if(!part){part=await json(`data/${state.year}/${item.part}`);state.parts.set(cacheKey,part)}
      const racer=(part.racers||[]).find(r=>(item.no&&String(r.registration)===String(item.no))||r.name===item.name);if(!racer)throw new Error('選手データが分割ファイル内にありません');
      state.selected=racer;state.view='search';setActiveTab('search');setStatus(`${state.year}年 / ${item.part}`);renderRacer(racer);
    }catch(e){setStatus('選手データを読み込めませんでした。',true);console.error(e)}
  }
  function setActiveTab(view){state.view=view;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
  function metricCells(m){return `<td>${m.races??0}</td><td>${m.first??0}</td><td>${m.second??0}</td><td>${m.third??0}</td><td>${fmt(m.winRate)}%</td><td>${fmt(m.top2Rate)}%</td><td>${fmt(m.top3Rate)}%</td><td>${fmt(m.avgST,3)}</td>`}
  function fmt(v,d=2){return Number.isFinite(Number(v))?Number(v).toFixed(d).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1'):'-'}
  function table(rows,label){return `<div class="table-wrap"><table><thead><tr><th>${label}</th><th>出走</th><th>1着</th><th>2着</th><th>3着</th><th>1着率</th><th>2連対率</th><th>3連対率</th><th>平均ST</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
  function renderRacer(r){
    const p=pref(r),o=r.overall||{},courses=Object.entries(r.byCourse||{}).sort((a,b)=>Number(a[0])-Number(b[0])),venues=Object.entries(r.byVenue||{}).sort((a,b)=>(b[1].races||0)-(a[1].races||0)),methods=Object.entries(r.winningMethods||{}),methodTotal=methods.reduce((s,[,v])=>s+Number(v||0),0);
    $('#content').innerHTML=`
      <div class="title-row"><div><h2 class="racer-name">${esc(r.name)}</h2><div class="reg">登録番号 ${esc(r.registration||'—')} ・ ${state.year}年</div></div><div class="actions"><button id="fav" class="action favorite ${p.favorite?'on':''}">★ ${p.favorite?'お気に入り済み':'お気に入り'}</button><button id="block" class="action blocked ${p.blocked?'on':''}">× ${p.blocked?'もう買わない済み':'もう買わない'}</button></div></div>
      <div class="stats" style="margin-top:16px"><div class="stat"><strong>${o.races??0}</strong><span>出走数</span></div><div class="stat"><strong>${fmt(o.winRate)}%</strong><span>1着率</span></div><div class="stat"><strong>${fmt(o.top2Rate)}%</strong><span>2連対率</span></div><div class="stat"><strong>${fmt(o.avgST,3)}</strong><span>平均ST</span></div></div>
      <h3>コース別</h3>${table(courses.map(([n,m])=>`<tr><td>${esc(n)}コース</td>${metricCells(m)}</tr>`),'コース')}
      <h3>場別</h3>${table(venues.map(([n,m])=>`<tr><td>${esc(n)}</td>${metricCells(m)}</tr>`),'レース場')}
      <h3>決まり手</h3><div class="method-grid">${methods.map(([n,v])=>`<div class="method"><div>${esc(n)}</div><strong>${v}回</strong><div class="reg">${methodTotal?fmt(v/methodTotal*100):0}%</div></div>`).join('')}</div>
      <h3>備考</h3><textarea id="note" placeholder="この選手についてのメモ（この端末だけに保存）">${esc(p.note)}</textarea><button id="saveNote" class="save-note">備考を保存</button>`;
    $('#fav').onclick=()=>{p.favorite=!p.favorite;if(p.favorite)p.blocked=false;savePrefs();renderRacer(r);toast(p.favorite?'お気に入りに追加しました':'お気に入りを解除しました')};
    $('#block').onclick=()=>{p.blocked=!p.blocked;if(p.blocked)p.favorite=false;savePrefs();renderRacer(r);toast(p.blocked?'もう買わないに追加しました':'もう買わないを解除しました')};
    $('#saveNote').onclick=()=>{p.note=$('#note').value;savePrefs();toast('備考を保存しました')};
  }
  function renderList(type){
    const items=Object.entries(state.prefs).filter(([,p])=>p[type]).sort((a,b)=>b[1].year-a[1].year||a[1].name.localeCompare(b[1].name,'ja'));
    $('#content').innerHTML=items.length?`<h2>${type==='favorite'?'★ お気に入り一覧':'× もう買わない一覧'}</h2>${items.map(([k,p],i)=>`<div class="list-card"><div><strong>${esc(p.name)}</strong><div class="reg">${p.year}年${p.registration?' ・ 登録 '+esc(p.registration):''}${p.note?' ・ 備考あり':''}</div></div><button data-i="${i}">表示</button></div>`).join('')}`:`<div class="empty">まだ登録されていません。</div>`;
    $('#content').querySelectorAll('button[data-i]').forEach((b,i)=>b.onclick=async()=>{const [,p]=items[i];await changeYear(p.year);const item=state.index?.racers.find(r=>(p.registration&&String(r.no)===String(p.registration))||r.name===p.name);if(item)selectFromIndex(item);else toast('この年の索引に選手が見つかりません')});
  }
  function renderCurrentView(){if(state.view==='favorites')renderList('favorite');else if(state.view==='blocked')renderList('blocked');else if(state.selected)renderRacer(state.selected);else $('#content').innerHTML='<div class="empty">上の検索欄に選手名を入力してください。</div>'}
  function updateCounts(){const vals=Object.values(state.prefs);$('#favCount').textContent=`(${vals.filter(p=>p.favorite).length})`;$('#blockCount').textContent=`(${vals.filter(p=>p.blocked).length})`}
  document.querySelectorAll('.year').forEach(b=>b.onclick=()=>changeYear(b.dataset.year));
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{setActiveTab(b.dataset.view);renderCurrentView()});
  $('#query').addEventListener('input',showSuggestions);$('#query').addEventListener('keydown',e=>{if(e.key==='Escape')$('#suggestions').classList.add('hidden')});document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#suggestions').classList.add('hidden')});
  updateCounts();changeYear(2026);
})();
</script>
</body>
</html>
